        <div class="col-12">

      </div>
      <div class="row d-flex justify-content-center mt-4">
        <div class="col">
          <img
            src="assets/images/photo_cv.jpg"

    <div class="title-dev">
      <p id="fullstack">FULLSTACK</p>
